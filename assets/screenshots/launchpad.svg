<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#eef3fb"/>
  <rect width="1280" height="130" fill="#111827"/>
  <rect y="130" width="1280" height="6" fill="#2563eb"/>
  <text x="56" y="62" font-family="Segoe UI, Arial" font-size="34" font-weight="700" fill="#ffffff">R2K RescueDesk USB</text>
  <text x="56" y="100" font-family="Segoe UI, Arial" font-size="18" fill="#cbd5e1">Professional service-bench command center for PC repair, backup, documentation, and closeout.</text>
  <rect x="56" y="170" width="1168" height="105" rx="8" fill="#ffffff" stroke="#d8deea"/>
  <text x="84" y="210" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#172033">Start Here</text>
  <text x="84" y="242" font-family="Segoe UI, Arial" font-size="17" fill="#5c677a">Open the service console to create a ticket, run triage, back up data, repair Windows, and close the job.</text>
  <rect x="84" y="292" width="350" height="160" rx="8" fill="#ffffff" stroke="#d8deea"/>
  <rect x="106" y="315" width="72" height="24" rx="4" fill="#0f7b5c"/>
  <text x="119" y="332" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#ffffff">Intake</text>
  <text x="106" y="370" font-family="Segoe UI, Arial" font-size="23" font-weight="700" fill="#172033">Customer Intake</text>
  <text x="106" y="402" font-family="Segoe UI, Arial" font-size="16" fill="#5c677a">Capture customer issue, approval points,</text>
  <text x="106" y="426" font-family="Segoe UI, Arial" font-size="16" fill="#5c677a">BitLocker status, and data risk.</text>
  <rect x="465" y="292" width="350" height="160" rx="8" fill="#ffffff" stroke="#d8deea"/>
  <rect x="487" y="315" width="68" height="24" rx="4" fill="#2563eb"/>
  <text x="500" y="332" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#ffffff">Triage</text>
  <text x="487" y="370" font-family="Segoe UI, Arial" font-size="23" font-weight="700" fill="#172033">Device Summary</text>
  <text x="487" y="402" font-family="Segoe UI, Arial" font-size="16" fill="#5c677a">Model, serial, Windows version, RAM,</text>
  <text x="487" y="426" font-family="Segoe UI, Arial" font-size="16" fill="#5c677a">storage, and drive score.</text>
  <rect x="846" y="292" width="350" height="160" rx="8" fill="#ffffff" stroke="#d8deea"/>
  <rect x="868" y="315" width="96" height="24" rx="4" fill="#8b5e00"/>
  <text x="880" y="332" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#ffffff">Backup Gate</text>
  <text x="868" y="370" font-family="Segoe UI, Arial" font-size="23" font-weight="700" fill="#172033">Safe Repair Flow</text>
  <text x="868" y="402" font-family="Segoe UI, Arial" font-size="16" fill="#5c677a">Risky actions warn first and require</text>
  <text x="868" y="426" font-family="Segoe UI, Arial" font-size="16" fill="#5c677a">backup or approval checkpoints.</text>
  <rect x="84" y="485" width="350" height="120" rx="8" fill="#ffffff" stroke="#d8deea"/>
  <text x="106" y="535" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#172033">Missing Tool Check</text>
  <text x="106" y="565" font-family="Segoe UI, Arial" font-size="16" fill="#5c677a">Manifest-driven download dashboard.</text>
  <rect x="465" y="485" width="350" height="120" rx="8" fill="#ffffff" stroke="#d8deea"/>
  <text x="487" y="535" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#172033">Customer Report</text>
  <text x="487" y="565" font-family="Segoe UI, Arial" font-size="16" fill="#5c677a">Branded report with link/QR section.</text>
  <rect x="846" y="485" width="350" height="120" rx="8" fill="#ffffff" stroke="#d8deea"/>
  <text x="868" y="535" font-family="Segoe UI, Arial" font-size="22" font-weight="700" fill="#172033">Close Ticket</text>
  <text x="868" y="565" font-family="Segoe UI, Arial" font-size="16" fill="#5c677a">Package logs and reports into a zip.</text>
</svg>

